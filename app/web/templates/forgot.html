FORGOT_HTML = r"""<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Zapomenuté heslo – Hodinářství Jindra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family:Arial,Helvetica,sans-serif; background:#f7f8fb; margin:0; padding:2rem; color:#222; }
    .card { max-width:560px; margin:0 auto; background:#fff; border:1px solid #ddd; border-radius:12px; padding:1rem; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    input { width:100%; padding:.6rem; border:1px solid #ddd; border-radius:8px; margin-top:.6rem; box-sizing:border-box; }
    .btn { background:#2563eb; color:#fff; border:none; border-radius:8px; padding:.6rem 1rem; cursor:pointer; margin-top:.8rem; }
    .btn-warn { background:#b91c1c; color:#fff; border:none; border-radius:8px; padding:.6rem 1rem; cursor:pointer; margin-left:.4rem; }
    .muted { color:#666; font-size:.92rem; }
    .msg { margin-top:1rem; padding:.6rem; border-radius:8px; background:#f1f5f9; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔁 Zapomenuté heslo</h2>

    <p class="muted">
      Zadej e-mail k účtu. Pokud existuje, pošleme instrukce pro obnovu hesla.
    </p>

    <input id="email" type="email" placeholder="např. jindra@email.cz" autocomplete="email">

    <div style="display:flex; gap:.5rem; flex-wrap:wrap;">
      <button class="btn" id="btnSend" type="button">Odeslat obnovu</button>
      <button class="btn" id="btnGoLogin" type="button">Přejít na přihlášení</button>
      <button class="btn-warn" id="btnClose" type="button">Zavřít kartu</button>
    </div>

    <div id="msg" class="msg" style="display:none;"></div>
  </div>

<script>
  const msg = document.getElementById("msg");

  document.getElementById("btnSend")?.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();

    msg.style.display = "block";
    msg.textContent = "Odesílám...";

    if (!email) {
      msg.textContent = "Zadej e-mail.";
      return;
    }

    try {
      const res = await fetch("/api/auth/forgot", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ email })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        msg.textContent = data.detail || "Chyba při obnově hesla.";
        return;
      }

      msg.textContent = data.message || "Pokud účet existuje, e-mail byl odeslán.";
    } catch (e) {
      msg.textContent = "Chyba spojení se serverem.";
    }
  });

  document.getElementById("btnGoLogin")?.addEventListener("click", () => {
    window.open("/login", "_blank", "noopener,noreferrer");
  });

  document.getElementById("btnClose")?.addEventListener("click", () => window.close());
</script>
</body>
</html>
"""
