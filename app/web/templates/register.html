<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Založení účtu – Hodinářství Jindra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family:Arial,Helvetica,sans-serif; background:#f7f8fb; margin:0; padding:2rem; color:#222; }
    .card { max-width:560px; margin:0 auto; background:#fff; border:1px solid #ddd; border-radius:12px; padding:1rem; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    label { display:block; margin-top:.6rem; font-weight:600; }
    input { width:100%; padding:.6rem; border:1px solid #ddd; border-radius:8px; margin-top:.2rem; }
    .btn { background:#2563eb; color:#fff; border:none; border-radius:8px; padding:.6rem 1rem; cursor:pointer; margin-top:.8rem; }
    .btn-ok { background:#16a34a; color:#fff; border:none; border-radius:8px; padding:.6rem 1rem; cursor:pointer; }
    .btn-warn { background:#b91c1c; color:#fff; border:none; border-radius:8px; padding:.6rem 1rem; cursor:pointer; }
    .muted { color:#666; font-size:.92rem; }
    .pill { display:inline-block; padding:.2rem .6rem; border-radius:999px; border:1px solid #ccd; background:#eef; font-size:.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>✅ Založení účtu</h2>

    <p class="muted" style="margin:.4rem 0 .8rem;">
      Plný přístup: <strong>500 Kč / měsíc</strong>.<br>
      Po založení účtu máš <strong>zkušební dobu 7 dní zdarma</strong>.
    </p>

    <div class="pill">7 dní zdarma</div>
    <div class="pill">500 Kč / měsíc</div>

    <label>Uživatelské jméno</label>
    <input id="regUser" autocomplete="username" />

    <label>Heslo</label>
    <input id="regPass" type="password" autocomplete="new-password" />

    <label>Heslo znovu</label>
    <input id="regPass2" type="password" autocomplete="new-password" />

    <div style="display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.8rem;">
      <button class="btn-ok" id="btnRegister" type="button">Založit účet</button>
      <button class="btn" id="btnGoLogin" type="button">Mám účet – přihlásit se</button>
      <button class="btn-warn" id="btnClose" type="button">Zavřít kartu</button>
    </div>

    <div id="regInfo" class="muted" style="margin-top:.6rem;"></div>
  </div>

  <script>
    async function doRegister() {
      const u = document.getElementById("regUser")?.value?.trim();
      const p1 = document.getElementById("regPass")?.value || "";
      const p2 = document.getElementById("regPass2")?.value || "";

      if (!u) return alert("Zadej uživatelské jméno.");
      if (p1.length < 6) return alert("Heslo musí mít aspoň 6 znaků.");
      if (p1 !== p2) return alert("Hesla se neshodují.");

      const res = await fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p1 })
      });

      const info = document.getElementById("regInfo");
      if (!res.ok) {
        const t = await res.text();
        if (info) info.textContent = "❌ Založení účtu se nepodařilo: " + t;
        return;
      }

      if (info) info.textContent = "✅ Účet založen. Teď se přihlas v nové kartě.";
      alert("Účet byl založen. Nyní se přihlas.");

      window.open("/login", "_blank", "noopener,noreferrer");
    }

    document.getElementById("btnRegister")?.addEventListener("click", doRegister);
    document.getElementById("btnGoLogin")?.addEventListener("click", () => {
      window.open("/login", "_blank", "noopener,noreferrer");
    });
    document.getElementById("btnClose")?.addEventListener("click", () => window.close());
  </script>
</body>
</html>
